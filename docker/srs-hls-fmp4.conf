# fMP4 HLS 需要 SRS 7.0.51 或更新版本，不能使用 SRS 5 镜像。
# 同时保留 RTMP 推流和 HTTP-FLV 拉流。
# 日志输出到容器标准输出；trace 用于详细诊断。
srs_log_tank console;
srs_log_level trace;
# 前台运行，由 Docker 管理进程生命周期。
daemon off;

# RTMP 推流端口和最大连接数。
listen 1935;
max_connections 1000;

http_server {
    # 开启内置 HTTP 服务。
    enabled on;
    # 提供播放列表、初始化片段、m4s 切片和 HTTP-FLV 流。
    listen 8080;
    # 此目录挂载到宿主机 docker/data。
    dir ./objs/nginx/html;
    # 提供跨域策略文件；浏览器跨域仍需检查实际响应头。
    crossdomain on;
}

# 未指定虚拟主机时使用的默认流配置。
vhost __defaultVhost__ {
    # 减少 TCP 小包和内部缓冲等待。
    tcp_nodelay on;
    min_latency on;

    # on_play 用于 RTMP/HTTP-FLV 播放鉴权；on_hls 是切片事件通知。
    # Go 服务对 on_play 返回 {"code":0} 表示允许。
    http_hooks {
        enabled on;
        on_play http://host.docker.internal:8081/api/srs/hooks/on_play;
        on_stop http://host.docker.internal:8081/api/srs/hooks/on_stop;
        on_hls http://host.docker.internal:8081/api/srs/hooks/on_hls;
    }

    play {
        # 缓存最近一组 GOP，让新观众更快从关键帧开始播放。
        gop_cache on;
    }

    # 将 RTMP 流重新封装为 HTTP-FLV。
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }

    # 将 RTMP 流切片为 fMP4 HLS。
    hls {
        enabled on;
        # 使用 fragmented MP4，而非 MPEG-TS 切片。
        hls_use_fmp4 on;
        # 输出目录，与 HTTP 静态文件根目录相同。
        hls_path ./objs/nginx/html;
        # 播放列表路径模板，例如 /live/app/2026-10-07/ashdunasniz/live001.m3u8。
        hls_m3u8_file [app]/[stream].m3u8;
        # 播放列表中的 EXT-X-MAP 指向此初始化片段。
        hls_init_file [app]/[stream]-init.mp4;
        # 媒体切片路径模板，[seq] 为切片序号。
        hls_fmp4_file [app]/[stream]-[seq].m4s;

        # 目标切片时长和播放列表窗口，单位为秒；实际切片点受关键帧影响。
        hls_fragment 2;
        hls_window 12;
        # 等待关键帧再切片，并清理过期切片。
        hls_wait_keyframe on;
        hls_cleanup on;
        # 为 HLS 创建伪会话，便于播放统计与会话回调。
        hls_ctx on;
        hls_ts_ctx on;
    }
}
