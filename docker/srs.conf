# SRS 7 组合配置：RTMP/WHIP 推流、HTTP-FLV/HLS 拉流、hooks 鉴权和 AES-128 HLS。
# FFmpeg 多码率脚本生成的 master.m3u8 由下方 HTTP 服务器分发。
# 日志输出到容器标准输出，便于使用 docker logs 查看。
srs_log_tank console;
# 日志级别：trace 输出详细诊断信息。
srs_log_level trace;
# 前台运行，让 Docker 管理 SRS 进程的生命周期。
daemon off;

# RTMP 推流和拉流监听端口，对应宿主机 1935 端口。
listen 1935;
# 同时允许的最大客户端连接数。
max_connections 1000;

# WHIP/WebRTC 信令和 SRS HTTP API 监听端口。
http_api {
    enabled on;
    listen 1985;
    crossdomain on;
}

# WebRTC 媒体通过 UDP 8000 传输。
rtc_server {
    enabled on;
    listen 8000;
    # 从容器环境变量 CANDIDATE 读取浏览器可以访问的 IP。
    # 本机测试用 127.0.0.1；远程访问须设置为服务器公网/局域网 IP。
    candidate $CANDIDATE;
}

# 内置 HTTP 服务器负责提供 HLS 文件和 HTTP-FLV 流。
http_server {
    # 开启内置 HTTP 服务器。
    enabled on;
    # HTTP 监听端口，对应宿主机 8080 端口。
    listen 8080;
    # HTTP 文件根目录；仅供 SRS 原生 HLS 使用，ABR 文件位于转码服务私有目录。
    dir ./objs/nginx/html;
    # 提供跨域访问策略文件；浏览器请求仍需检查实际响应头。
    crossdomain on;
}

# 未指定虚拟主机时使用的默认流配置。
vhost __defaultVhost__ {
    # 关闭 TCP Nagle 算法，减少小数据包等待时间。
    tcp_nodelay on;
    # 启用低延迟模式，缩短 SRS 内部缓冲等待。
    min_latency on;

    # 开启 WHIP/WebRTC 推流与播放，并允许与 RTMP 流互通。
    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    # on_publish 校验 RTMP/WHIP 推流；on_play 校验 RTMP/HTTP-FLV 拉流。
    # Go 服务返回 {"code":0} 表示允许，非零 code 表示拒绝。
    # token 作为 URL 查询参数传入，SRS 在回调的 param 字段中转发。
    # Go 服务需监听容器可达的 8081；Linux Docker 启动时映射 host-gateway。
    # on_hls 是切片事件通知，不等同于 HLS 静态文件鉴权。
    http_hooks {
        enabled on;
        on_publish http://host.docker.internal:8081/api/srs/hooks/on_publish;
        on_unpublish http://host.docker.internal:8081/api/srs/hooks/on_unpublish;
        on_play http://host.docker.internal:8081/api/srs/hooks/on_play;
        on_stop http://host.docker.internal:8081/api/srs/hooks/on_stop;
        on_hls http://host.docker.internal:8081/api/srs/hooks/on_hls;
    }

    # RTMP/HTTP-FLV 播放行为。
    play {
        # 缓存最近一组 GOP，使新观众能更快从关键帧开始播放。
        gop_cache on;
    }

    # 将收到的 RTMP 流重新封装为 HTTP-FLV，供 flv.js/mpegts.js 播放。
    http_remux {
        # 开启 HTTP-FLV 输出。
        enabled on;
        # 拉流路径模板，例如 /live/app/2026-10-07/ashdunasniz/live001.flv。
        mount [vhost]/[app]/[stream].flv;
    }

    # 将 RTMP 或转为 RTMP 的 WHIP 流切片为加密 HLS。
    hls {
        # 开启 HLS 输出。
        enabled on;
        # 容器格式：off 使用 MPEG-TS，on 使用 fragmented MP4。
        # 当前前端同时支持 TS 和 fMP4；保持 off 兼容性更好。
        hls_use_fmp4 off;

        # HLS 文件输出目录，与 HTTP 根目录使用同一宿主机映射。
        hls_path ./objs/nginx/html;

        # m3u8 播放列表文件名模板。
        hls_m3u8_file [app]/[stream].m3u8;
        # TS 切片文件名模板，按序号生成。
        hls_ts_file [app]/[stream]-[seq].ts;
        # fMP4 切片文件名模板，仅 hls_use_fmp4 on 时使用。
        # hls_fmp4_file [app]/[stream]-[seq].m4s;
        # fMP4 初始化文件名，仅 hls_use_fmp4 on 时使用。
        # hls_init_file [app]/[stream]/init.mp4;

        # 目标切片时长，单位为秒；实际时长受视频关键帧影响。
        hls_fragment 2;
        # m3u8 的目标时长系数，通常保持 1.0。
        hls_td_ratio 1.0;
        # 纯音频流允许的切片溢出比例。
        hls_aof_ratio 2.1;
        # 播放列表保留窗口，单位为秒。
        hls_window 12;
        # HLS 生成异常时继续尝试输出，不主动断开推流。
        hls_on_error continue;

        # HLS 使用的默认音频编码和视频编码。
        hls_acodec aac;
        hls_vcodec h264;

        # 对 SRS 原生 HLS 的 TS 切片启用 AES-128 加密，每 5 片轮换密钥。
        # FFmpeg ABR 脚本生成的 HLS 不受这里的 hls_keys 控制。
        hls_keys on;
        hls_fragments_per_key 5;
        hls_key_file [app]/[stream]-[seq].key;
        hls_key_file_path ./objs/nginx/html;
        # 本机播放使用 localhost；远程观众须换成可访问的域名或地址。
        # 密钥文件目前可经 8080 直接访问，正式使用需在代理层鉴权。
        hls_key_url http://localhost:8080;

        # 自动删除已过期的 HLS 切片文件。
        hls_cleanup on;
        # 推流无数据超过该秒数后清理 HLS 文件；0 表示不自动清理。
        hls_dispose 120;
        # 等待关键帧后再切片，避免新切片无法独立解码。
        hls_wait_keyframe on;
        # 不使用按时间取整的 TS 文件名算法。
        hls_ts_floor off;
        # 为 HLS 创建伪会话，便于播放统计与会话回调。
        hls_ctx on;
        hls_ts_ctx on;

        # 可选：为 TS 地址增加公共 URL 前缀。部署在反向代理或 CDN 后再填写。
        # hls_entry_prefix https://example.com/;

        # on_hls_notify 回调启用时，单次通知读取的最大字节数。
        # hls_nb_notify 64;

        # HLS 会话统计会增加请求开销；使用 CDN 缓存时需评估缓存命中率。
        # AAC 时间戳计算方式；音频时间戳异常时再调整。
        # hls_dts_directly on;

        # on_hls 和 on_hls_notify 属于 vhost 的 http_hooks 配置，不写在 hls 块中。
    }
}
