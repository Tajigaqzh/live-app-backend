# 本地 RTMP 推流、HTTP-FLV 拉流和 AES-128 加密 HLS 配置。
# 需要加密 HLS 时，用本文件替代 srs.conf 挂载到容器。
# 日志写入容器标准输出，便于使用 docker logs 查看。
srs_log_tank console;
# trace 级别输出详细诊断日志。
srs_log_level trace;
# 前台运行，由 Docker 管理进程生命周期。
daemon off;

# RTMP 推流和拉流监听端口，对应宿主机 1935。
listen 1935;
# 允许的最大并发客户端连接数。
max_connections 1000;

# 内置 HTTP 服务器提供 HLS 播放列表、切片、密钥和 HTTP-FLV。
http_server {
    # 开启 HTTP 服务。
    enabled on;
    # HTTP 监听端口，对应宿主机 8080。
    listen 8080;
    # 静态文件根目录；容器启动时映射到宿主机 docker/data。
    dir ./objs/nginx/html;
    # 提供跨域访问策略文件；浏览器跨域仍需检查实际响应头。
    crossdomain on;
}

# 未指定虚拟主机时使用的默认流配置。
vhost __defaultVhost__ {
    # 关闭 TCP Nagle 算法，减少小数据包的发送等待。
    tcp_nodelay on;
    # 缩短 SRS 内部缓冲等待，以降低直播延迟。
    min_latency on;

    # on_play 用于 RTMP/HTTP-FLV 播放鉴权；on_hls 是切片事件通知。
    # Go 服务对 on_play 返回 {"code":0} 表示允许。
    http_hooks {
        enabled on;
        on_play http://host.docker.internal:8081/api/srs/hooks/on_play;
        on_stop http://host.docker.internal:8081/api/srs/hooks/on_stop;
        on_hls http://host.docker.internal:8081/api/srs/hooks/on_hls;
    }

    # RTMP/HTTP-FLV 播放设置。
    play {
        # 缓存最近一组 GOP，让新观众更快从关键帧开始播放。
        gop_cache on;
    }

    # 将收到的 RTMP 流重新封装为 HTTP-FLV。
    http_remux {
        # 开启 HTTP-FLV 输出。
        enabled on;
        # 拉流路径模板，例如 /live/app/2026-10-07/ashdunasniz/live001.flv。
        mount [vhost]/[app]/[stream].flv;
    }

    # 将 RTMP 流切片为加密 HLS 播放列表和媒体文件。
    hls {
        # 开启 HLS 输出。
        enabled on;
        # 使用 MPEG-TS 切片；此处的 AES-128 配置面向 TS 切片。
        hls_use_fmp4 off;
        # HLS 文件输出根目录，与 HTTP 根目录和宿主机映射一致。
        hls_path ./objs/nginx/html;
        # m3u8 播放列表路径模板。
        hls_m3u8_file [app]/[stream].m3u8;
        # TS 切片路径模板，[seq] 为切片序号。
        hls_ts_file [app]/[stream]-[seq].ts;
        # 目标切片时长，单位为秒；实际时长受关键帧间隔影响。
        hls_fragment 2;
        # 播放列表保留的时间窗口，单位为秒。
        hls_window 12;
        # 自动清理过期的切片和相关文件。
        hls_cleanup on;
        # 等待关键帧再切片，使每个切片更容易独立解码。
        hls_wait_keyframe on;
        # 为 HLS 创建伪会话，便于播放统计与会话回调。
        hls_ctx on;
        hls_ts_ctx on;

        # 开启 HLS AES-128 切片加密，并在播放列表写入密钥引用。
        hls_keys on;
        # 每五个切片生成并使用一把新密钥。
        hls_fragments_per_key 5;
        # 密钥文件名模板，[seq] 对应密钥序号。
        hls_key_file [app]/[stream]-[seq].key;
        # 密钥文件写入根目录，映射到宿主机 docker/data。
        hls_key_file_path ./objs/nginx/html;
        # 播放器下载密钥时使用的 URL 前缀；远程观看须替换为可访问的服务器地址。
        # 密钥当前通过 HTTP 公开提供；此配置本身不提供观看鉴权。
        hls_key_url http://localhost:8080;
    }
}
